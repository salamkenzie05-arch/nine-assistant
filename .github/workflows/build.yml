name: Build Nine APK

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Model kecil Vosk (bahasa Inggris, ±40 MB) untuk wake word "hey nine", dibundel ke APK.
      - uses: actions/cache@v4
        with:
          path: vosk-cache
          key: vosk-model-small-en-us-0.15

      - name: Fetch Vosk wake-word model
        shell: bash
        run: |
          set -e
          mkdir -p vosk-cache app/src/main/assets
          if [ ! -s vosk-cache/model.zip ]; then
            curl -fL --retry 4 --retry-delay 5 -o vosk-cache/model.zip \
              https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          fi
          rm -rf app/src/main/assets/vosk-en vosk-tmp && mkdir vosk-tmp
          unzip -q vosk-cache/model.zip -d vosk-tmp
          mv vosk-tmp/vosk-model-small-en-us-0.15 app/src/main/assets/vosk-en
          du -sh app/src/main/assets/vosk-en

      - name: Unit tests + release APK (lite & full)
        shell: bash
        env:
          NINE_KEYSTORE_PASSWORD: ${{ secrets.NINE_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace -PversionCode=${{ github.run_number }} \
            testLiteReleaseUnitTest assembleLiteRelease assembleFullRelease 2>&1 | tee build.log

      # Bila gagal: tampilkan ringkasan error sebagai anotasi (bisa dibaca tanpa login di repo publik).
      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          if [ ! -f build.log ]; then exit 0; fi
          grep -nE "^e: |error:|ERROR:|FAILED|What went wrong|Could not|Unresolved|> .*Exception|AssertionError|expected:" build.log \
            | grep -v "^.*warning:" | head -60 > errors.txt || true
          if [ ! -s errors.txt ]; then tail -60 build.log > errors.txt; fi
          i=0
          while IFS= read -r line; do
            i=$((i+1))
            msg="${line//'%'/'%25'}"
            echo "::error title=build-error-$i::${msg:0:900}"
            if [ $i -ge 45 ]; then break; fi
          done < errors.txt

      # Penjaga: Nine.apk tidak boleh memuat layanan aksesibilitas (itu yang diblokir Play Protect),
      # dan Nine-Full.apk harus memuatnya. Manifes hasil gabungan dicetak supaya bisa diperiksa.
      - name: Verify editions (manifest)
        shell: bash
        run: |
          set -e
          lite=$(find app/build/intermediates -path '*liteRelease*' -name AndroidManifest.xml | grep -i merged_manifests | head -1)
          full=$(find app/build/intermediates -path '*fullRelease*' -name AndroidManifest.xml | grep -i merged_manifests | head -1)
          echo "lite: $lite"; echo "full: $full"
          test -n "$lite" && test -n "$full"
          echo "--- izin lite"; grep -o 'android.permission.[A-Z_]*' "$lite" | sort -u
          echo "--- izin full"; grep -o 'android.permission.[A-Z_]*' "$full" | sort -u
          if grep -q 'BIND_ACCESSIBILITY_SERVICE\|AccessibilityService' "$lite"; then
            echo "::error::Nine.apk (lite) masih memuat layanan aksesibilitas"; exit 1
          fi
          if ! grep -q 'BIND_ACCESSIBILITY_SERVICE' "$full"; then
            echo "::error::Nine-Full.apk tidak memuat layanan aksesibilitas"; exit 1
          fi

      # Menyebut kunci mana yang menandatangani APK (sidik jari SHA-256 sertifikat), agar jelas kapan kunci baru aktif.
      - name: Check signing key
        id: sig
        shell: bash
        run: |
          set +e
          tool=$(ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          fp=""
          if [ -n "$tool" ]; then
            fp=$("$tool" verify --print-certs app/build/outputs/apk/lite/release/app-lite-release.apk 2>/dev/null \
              | grep -m1 'certificate SHA-256 digest' | sed 's/.*: *//' | tr -d ':' | tr 'A-F' 'a-f')
          fi
          echo "sidik jari: ${fp:-tidak terbaca}"
          if [ "$fp" = "3be21637a261df39afb1895e374d99545d86bb72b670d899843c84460a6a9a1d" ]; then
            echo "label=kunci rilis baru (rahasia CI)" >> "$GITHUB_OUTPUT"
            echo "::notice::APK ditandatangani KUNCI BARU."
          elif [ "$fp" = "9441722a211023f8fccfcd4df93850e99b35ecb898b3ae4e8d2efa549d966cb2" ]; then
            echo "label=kunci lama yang publik (rahasia NINE_KEYSTORE_PASSWORD belum dipasang)" >> "$GITHUB_OUTPUT"
            echo "::warning::APK masih ditandatangani kunci LAMA yang publik. Pasang rahasia NINE_KEYSTORE_PASSWORD di Settings > Secrets and variables > Actions."
          else
            echo "label=tidak terverifikasi" >> "$GITHUB_OUTPUT"
            echo "::warning::Sidik jari tanda tangan tidak dikenali atau tidak terbaca."
          fi

      - name: Rename APKs
        shell: bash
        run: |
          set -e
          cp app/build/outputs/apk/lite/release/app-lite-release.apk Nine.apk
          cp app/build/outputs/apk/full/release/app-full-release.apk Nine-Full.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Nine-apk
          path: |
            Nine.apk
            Nine-Full.apk

      - name: Publish release (latest)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Nine BETA 1.0 (build ${{ github.run_number }})
          body: |
            Tanda tangan APK: ${{ steps.sig.outputs.label }}.

            **Nine BETA 1.0** - versi beta, masih dalam pengujian. Fitur yang memakai layanan aksesibilitas (on/off Wi-Fi/Bluetooth otomatis, putar lagu otomatis di YouTube Music) belum teruji di semua HP; bila gagal, Nine menampilkan kode galat singkat.

            APK Nine untuk Android (arm64, Android 8.0+). Dua edisi dengan package yang sama (bisa saling menimpa):

            - **Nine.apk** (ringan): langsung bisa dipasang, lolos Google Play Protect.
              https://github.com/${{ github.repository }}/releases/latest/download/Nine.apk
            - **Nine-Full.apk**: ditambah layanan aksesibilitas (tombol melayang, on/off Wi-Fi/Bluetooth/hotspot langsung, putar lagu otomatis di YouTube Music).
              Google Play Protect memblokir APK sideload semacam ini; matikan sementara "Pindai aplikasi dengan Play Protect" saat memasang.
              https://github.com/${{ github.repository }}/releases/latest/download/Nine-Full.apk
          files: |
            Nine.apk
            Nine-Full.apk
          make_latest: true
